
# Application
spring.application.name=weather-api
server.port=8024

# HTTP client timeouts
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=5s

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Application information
info.app.name=Weather API
info.app.description=Weather REST API built using Java 25 and Spring Boot
info.app.version=1.0.0

management.info.env.enabled=true
